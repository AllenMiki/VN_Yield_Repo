version: '3.8'

services:
  streamlit:
    build: .
    container_name: vn-mes-yield
    ports:
      - "8501:8501"
    restart: unless-stopped
    # 可选：挂载配置文件
    # volumes:
    #   - ./config.json:/app/config.json
    environment:
      - STREAMLIT_SERVER.headless=true
      - STREAMLIT_SERVER_PORT=8501